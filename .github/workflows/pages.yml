name: Publish True GOAT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check scoring, game and source data
        run: node --test app/tests/model.test.mjs app/tests/guess.test.mjs app/tests/player-search.test.mjs app/tests/guess-data.test.mjs app/tests/guess-eligibility-data.test.mjs app/tests/onboarding.test.mjs app/tests/modules.test.mjs app/tests/themes.test.mjs app/tests/player-library.test.mjs app/tests/pool-variants.test.mjs app/tests/guess-readability.test.mjs app/tests/guess-custom.test.mjs app/tests/static-build.test.mjs app/tests/i18n.test.mjs app/tests/guess-coach.test.mjs
      - name: Check multiplayer database and referee rules
        run: |
          npm install --prefix output/backend-tests --no-audit --no-fund @electric-sql/pglite@0.5.8
          GOAT_PGLITE_MODULE="file://$GITHUB_WORKSPACE/output/backend-tests/node_modules/@electric-sql/pglite/dist/index.js" node scripts/22_verify_arena_sql.mjs
          GOAT_PGLITE_MODULE="file://$GITHUB_WORKSPACE/output/backend-tests/node_modules/@electric-sql/pglite/dist/index.js" node scripts/24_verify_multiplayer_sql.mjs
      - name: Build static site from the explicit file allowlist
        run: node scripts/16_build_static_site.mjs
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
